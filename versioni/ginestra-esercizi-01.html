<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginestra - Esercizi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    header {
      background: #1e293b;
      padding: 16px 28px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 38px; height: 38px;
      background: #58cc02;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 24px; color: #fff;
      box-shadow: 0 3px 0 #46a302;
    }
    .brand-title { font-size: 20px; font-weight: 900; color: #fff; }
    .brand-sub { font-size: 13px; color: #94a3b8; font-weight: 600; }
    .header-btn {
      background: #58cc02;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 3px 0 #46a302;
      cursor: pointer;
      transition: all .1s;
    }
    .header-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #46a302; }

    /* ---------- Layout ---------- */
    .app-layout { flex: 1; display: flex; overflow: hidden; height: calc(100vh - 71px); }

    .sidebar {
      width: 360px;
      background: #1e293b;
      border-right: 1px solid #334155;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .section-label {
      font-size: 12px; font-weight: 900; letter-spacing: .8px;
      text-transform: uppercase; color: #64748b;
      margin: 12px 10px 4px;
    }
    .section-label:first-child { margin-top: 0; }
    .screen-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer;
      background: #0f172a;
      border: 1px solid transparent;
      transition: all .15s ease;
      color: #cbd5e1;
      text-align: left;
      width: 100%;
    }
    .screen-item:hover { background: #334155; color: #fff; }
    .screen-item.active { background: #1e3a5f; border-color: #38bdf8; color: #fff; }
    .screen-num {
      width: 28px; height: 28px; border-radius: 8px;
      background: #334155; color: #94a3b8;
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .screen-item.active .screen-num { background: #0284c7; color: #fff; }
    .screen-info { flex: 1; overflow: hidden; }
    .screen-name { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .screen-desc { font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .stage {
      flex: 1;
      background: #0b1120;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    .preview-frame {
      width: 430px;
      height: 932px;
      max-height: calc(100vh - 71px - 48px);
      min-height: 640px;
      flex-shrink: 0;
      border-radius: 48px;
      border: 12px solid #1e293b;
      box-shadow: 0 30px 80px rgba(0,0,0,.7);
      background: #fff;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      body { min-height: 100vh; }
      .app-layout { flex-direction: column; height: auto; overflow: visible; }
      .sidebar { width: 100%; max-height: 220px; border-right: none; border-bottom: 1px solid #334155; }
      .preview-frame { width: 100%; max-width: 430px; height: 750px; max-height: none; }
      .stage { padding: 16px; overflow: visible; }
      header { padding: 12px 16px; }
      .brand-sub { display: none; }
    }

    /* ======================================================
       PHONE (stile delle schermate Duolingo)
       ====================================================== */
    .phone { height: 100%; background: #fff; display: flex; flex-direction: column; position: relative; color: #3c3c3c; }

    .status-bar {
      padding: 14px 28px 0;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 15px; font-weight: 800; color: #000;
      background: #fff;
    }
    .brand-logo { font-weight: 900; color: #58cc02; font-size: 17px; letter-spacing: -.3px; }
    .status-icons { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; }

    .lesson-bar { padding: 14px 20px 10px; display: flex; align-items: center; gap: 16px; }
    .close-btn { background: none; border: none; cursor: pointer; color: #afafaf; display: flex; align-items: center; }
    .close-btn:hover { color: #777; }
    .progress-bg { flex: 1; height: 14px; background: #e5e5e5; border-radius: 7px; overflow: hidden; }
    .progress-fill { width: 0; height: 100%; background: #ffc800; border-radius: 7px; transition: width .35s ease; }
    .heart-stat { display: flex; align-items: center; gap: 6px; color: #ff4b4b; font-size: 16px; font-weight: 900; }

    .content { flex: 1; padding: 12px 20px 16px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
    .title { font-size: 22px; font-weight: 900; color: #3c3c3c; margin-bottom: 22px; }
    #body { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* mascotte + fumetto */
    .speaker-section { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 24px; }
    .mascot { width: 84px; flex-shrink: 0; }
    .mascot svg { width: 100%; height: auto; display: block; }
    .speech-bubble {
      background: #fff;
      border: 2px solid #e5e5e5;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      position: relative;
      box-shadow: 0 2px 0 #f0f0f0;
      flex: 1;
      margin-top: 8px;
      font-size: 19px; font-weight: 700; line-height: 1.4;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .speech-bubble::before, .speech-bubble::after {
      content: ''; position: absolute; top: 20px; width: 0; height: 0; border-style: solid;
    }
    .speech-bubble::before { border-width: 8px 12px 8px 0; border-color: transparent #e5e5e5 transparent transparent; left: -13px; }
    .speech-bubble::after { border-width: 7px 10px 7px 0; border-color: transparent #fff transparent transparent; left: -10px; }
    .bubble-label { font-size: 12px; font-weight: 900; color: #afafaf; letter-spacing: .8px; text-transform: uppercase; display: block; margin-bottom: 2px; }
    .audio-btn {
      width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
      background: #ddf4ff; border: 2px solid #84d8ff; box-shadow: 0 3px 0 #84d8ff;
      color: #1cb0f6; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .audio-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #84d8ff; }
    .audio-btn.slow { background: #fff; border-color: #e5e5e5; box-shadow: 0 3px 0 #e5e5e5; color: #afafaf; }
    .audio-btn:disabled { opacity: .5; cursor: default; }

    .sentence { font-size: 21px; font-weight: 800; line-height: 1.7; margin-bottom: 26px; }
    .blank {
      display: inline-block; min-width: 80px; padding: 0 8px; text-align: center;
      border-bottom: 3px solid #afafaf; color: #1899d6;
    }
    .blank.ok { color: #58a700; border-color: #58cc02; }
    .blank.bad { color: #ea2b2b; border-color: #ff4b4b; }

    .prompt-big { font-size: 28px; font-weight: 900; margin-bottom: 6px; }
    .prompt-sub { font-size: 17px; font-weight: 700; color: #777; margin-bottom: 22px; }

    /* scelte */
    .options-col { display: flex; flex-direction: column; gap: 12px; }
    .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .options-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice-card {
      border: 2px solid #e5e5e5; border-radius: 16px; padding: 15px 20px;
      font-size: 18px; font-weight: 800; color: #3c3c3c; background: #fff;
      box-shadow: 0 3px 0 #e5e5e5; cursor: pointer; transition: all .12s;
      text-align: left; overflow-wrap: anywhere;
    }
    .options-grid .choice-card, .options-two .choice-card { text-align: center; padding: 18px 8px; }
    .choice-card:hover { background: #fcfcfc; }
    .choice-card:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e5e5; }
    .choice-card.selected { background: #ddf4ff; border-color: #84d8ff; color: #1899d6; box-shadow: 0 3px 0 #84d8ff; }
    .choice-card.right { background: #e7ffcf; border-color: #a4e478; color: #58a700; box-shadow: 0 3px 0 #8ad058; }
    .choice-card.wrong { background: #ffdfe0; border-color: #ffb8b8; color: #ea2b2b; box-shadow: 0 3px 0 #ffb8b8; }
    .choice-card:disabled { cursor: default; }

    .hint-btn {
      align-self: flex-start; background: none; border: none; color: #1cb0f6;
      font-size: 14px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase;
      cursor: pointer; margin-bottom: 8px; padding: 4px 0;
    }
    .hint-line { font-size: 15px; font-weight: 700; color: #777; margin-bottom: 14px; }
    .hint-line[hidden] { display: none; }

    /* chip (costruttore) */
    .answer-line-area {
      min-height: 84px;
      border-top: 2px solid #e5e5e5; border-bottom: 2px solid #e5e5e5;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 10px 0; margin-bottom: 26px;
    }
    .answer-line-area:empty::before { content: "Tocca i pezzi qui sotto"; color: #afafaf; font-weight: 700; font-size: 15px; }
    .word-bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .word-chip {
      background: #fff; border: 2px solid #e5e5e5; border-radius: 14px;
      padding: 10px 16px; font-size: 17px; font-weight: 800; color: #4b4b4b;
      box-shadow: 0 3px 0 #e5e5e5; cursor: pointer; user-select: none; transition: all .1s ease;
    }
    .word-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e5e5; }
    .word-chip.placed { background: #e5e5e5; color: transparent; border-color: #e5e5e5; box-shadow: none; cursor: default; }
    .word-chip.letter { min-width: 46px; padding: 10px 0; text-align: center; font-size: 20px; }
    .words-line { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .word-chip.sel { background: #ddf4ff; border-color: #84d8ff; color: #1899d6; box-shadow: 0 3px 0 #84d8ff; }
    .word-chip.right { background: #e7ffcf; border-color: #a4e478; color: #58a700; box-shadow: 0 3px 0 #8ad058; }
    .word-chip.wrong { background: #ffdfe0; border-color: #ffb8b8; color: #ea2b2b; box-shadow: 0 3px 0 #ffb8b8; }

    /* coppie / memory */
    .pairs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pair-tile {
      min-height: 62px; padding: 6px 10px;
      border: 2px solid #e5e5e5; border-radius: 16px; background: #fff;
      box-shadow: 0 3px 0 #e5e5e5;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #3c3c3c; text-align: center;
      cursor: pointer; user-select: none; position: relative; transition: all .12s ease;
      overflow-wrap: anywhere;
    }
    .pair-tile:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e5e5; }
    .pair-tile.selected { background: #ddf4ff; border-color: #84d8ff; color: #1899d6; box-shadow: 0 3px 0 #84d8ff; }
    .pair-tile.completed { border-color: #f0f0f0; color: #d0d0d0; box-shadow: none; cursor: default; }
    .pair-tile.matched-active { border-color: #a4e478; background: #e7ffcf; color: #58a700; box-shadow: 0 3px 0 #8ad058; cursor: default; }
    .pair-tile.mismatch { background: #ffdfe0; border-color: #ffb8b8; color: #ea2b2b; box-shadow: 0 3px 0 #ffb8b8; }
    .sparkle { position: absolute; width: 7px; height: 7px; background: #78c800; transform: rotate(45deg); opacity: .65; }
    .sp-a { top: 10px; right: 12px; } .sp-b { bottom: 10px; left: 12px; } .sp-c { top: 12px; left: 35%; }

    .mem-card { min-height: 78px; font-size: 15px; }
    .mem-card.down { background: #58cc02; border-color: #58cc02; box-shadow: 0 3px 0 #46a302; color: #fff; font-size: 26px; }
    .mem-card.up { background: #ddf4ff; border-color: #84d8ff; color: #1899d6; box-shadow: 0 3px 0 #84d8ff; }
    .moves { font-size: 14px; font-weight: 800; color: #afafaf; text-transform: uppercase; letter-spacing: .8px; margin-top: 16px; text-align: center; }

    /* impiccato */
    .hang { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
    .hang span {
      width: 30px; height: 44px; border-bottom: 3px solid #3c3c3c;
      font-size: 28px; font-weight: 900; text-align: center; text-transform: uppercase;
    }
    .hang.lost span { color: #ea2b2b; }
    .lives { text-align: center; font-size: 20px; letter-spacing: 4px; color: #ff4b4b; margin-bottom: 18px; }
    .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .key {
      width: 44px; height: 46px; border: 2px solid #e5e5e5; border-radius: 12px; background: #fff;
      box-shadow: 0 3px 0 #e5e5e5; font-size: 18px; font-weight: 800; color: #4b4b4b;
      text-transform: uppercase; cursor: pointer;
    }
    .key:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e5e5; }
    .key.hit { background: #e7ffcf; border-color: #a4e478; color: #58a700; box-shadow: none; }
    .key.miss { background: #ffdfe0; border-color: #ffb8b8; color: #ea2b2b; box-shadow: none; }
    .key:disabled { cursor: default; }

    /* testo */
    .text-in {
      width: 100%; font-size: 19px; font-weight: 700; color: #3c3c3c;
      border: 2px solid #e5e5e5; border-radius: 16px; background: #f7f7f7;
      padding: 16px; margin-bottom: 14px; outline: none;
    }
    .text-in:focus { border-color: #84d8ff; background: #fff; }
    .text-in:disabled { color: #afafaf; }

    /* risultato */
    .result { align-items: center; text-align: center; justify-content: center; gap: 10px; }
    .result .mascot { width: 140px; }
    .result h2 { font-size: 28px; font-weight: 900; color: #ffc800; }
    .result p { font-size: 17px; font-weight: 700; color: #777; }
    .stats { display: flex; gap: 12px; margin-top: 18px; width: 100%; }
    .stat { flex: 1; border: 2px solid; border-radius: 16px; overflow: hidden; }
    .stat b { display: block; font-size: 12px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase; color: #fff; padding: 5px 0; }
    .stat span { display: block; font-size: 22px; font-weight: 900; padding: 14px 0; }
    .stat.y { border-color: #ffc800; } .stat.y b { background: #ffc800; } .stat.y span { color: #d9a900; }
    .stat.r { border-color: #ff4b4b; } .stat.r b { background: #ff4b4b; } .stat.r span { color: #ff4b4b; }

    /* footer */
    .footer { padding: 14px 20px 24px; background: #fff; border-top: 2px solid #e5e5e5; }
    .btn-main {
      width: 100%; height: 50px; border: none; border-radius: 16px;
      background: #58cc02; color: #fff;
      font-size: 16px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase;
      box-shadow: 0 4px 0 #46a302; cursor: pointer; transition: all .1s ease;
    }
    .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 #46a302; }
    .btn-main:disabled { background: #e5e5e5; color: #afafaf; box-shadow: none; cursor: not-allowed; transform: none; }
    .home-indicator { width: 140px; height: 5px; background: #000; border-radius: 3px; margin: 14px auto 0; }

    .drawer { padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 10px; }
    .drawer.good { background: #d7ffb8; border-top: 2px solid #b8f28b; }
    .drawer.bad { background: #ffdfe0; border-top: 2px solid #ffb8b8; }
    .drawer-status { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 900; }
    .drawer.good .drawer-status { color: #58a700; }
    .drawer.bad .drawer-status { color: #ea2b2b; font-size: 20px; }
    .drawer-solution { font-size: 17px; font-weight: 800; color: #ea2b2b; }
    .drawer-note { font-size: 14.5px; font-weight: 700; color: #777; }
    .drawer.good .drawer-note { color: #58a700; }
    .drawer .btn-main { margin-top: 6px; }
    .drawer.bad .btn-main { background: #ff4b4b; box-shadow: 0 4px 0 #ea2b2b; }
    .drawer.bad .btn-main:active { box-shadow: 0 1px 0 #ea2b2b; }

    /* modale di uscita */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 150;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-overlay[hidden] { display: none; }
    .quit-modal {
      background: #fff; border-radius: 28px; padding: 28px 24px; width: 100%;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .quit-modal .mascot { width: 100px; margin-bottom: 16px; }
    .quit-title { font-size: 19px; font-weight: 900; color: #3c3c3c; margin-bottom: 24px; line-height: 1.35; }
    .btn-blue {
      width: 100%; height: 50px; background: #1cb0f6; border: none; border-radius: 16px; color: #fff;
      font-size: 15px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase;
      box-shadow: 0 4px 0 #1899d6; cursor: pointer; margin-bottom: 14px;
    }
    .btn-link { background: none; border: none; color: #1cb0f6; font-size: 15px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase; cursor: pointer; }
  
    /* ---------- controlli dati ---------- */
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .ctl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; color: #94a3b8; }
    .sel { background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 800; max-width: 180px; }
    .header-btn.alt { background: #334155; box-shadow: 0 3px 0 #1e293b; display: inline-block; }
    label.header-btn { cursor: pointer; }
    .screen-item.off { opacity: .45; }
    /* ---------- Allenamento ---------- */
    #body.train { flex: none; }
    .tr-bar { display: flex; gap: 8px; margin: 4px 0 6px; }
    .tr-search { flex: 1; min-width: 0; border: 2px solid #e5e5e5; border-radius: 12px; padding: 9px 12px; font-size: 14px; font-weight: 700; color: #3c3c3c; background: #fff; }
    .tr-toggle { border: 2px solid #e5e5e5; border-bottom-width: 4px; background: #fff; color: #1cb0f6; border-radius: 12px; padding: 0 12px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .tr-count { font-size: 12px; font-weight: 800; color: #94a3b8; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .5px; }
    .tr-list { display: flex; flex-direction: column; gap: 8px; }
    .tr-card { border: 2px solid #e5e5e5; border-bottom-width: 4px; border-radius: 16px; background: #fff; }
    .tr-card.open { border-color: #84d8ff; }
    .tr-card.unsure { border-style: dashed; border-color: #f5c242; }
    .tr-row { display: flex; align-items: stretch; }
    .tr-spk { flex: none; width: 48px; border: 0; background: transparent; color: #1cb0f6; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 14px 0 0 14px; }
    .tr-spk:disabled { color: #cbd5e1; cursor: not-allowed; }
    .tr-spk:hover:not(:disabled) { background: #ddf4ff; }
    .tr-head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; padding: 10px 12px 10px 2px; cursor: pointer; font-family: inherit; }
    .tr-txt { flex: 1; min-width: 0; }
    .tr-it { font-size: 16px; font-weight: 800; color: #3c3c3c; overflow-wrap: anywhere; }
    .tr-pt { font-size: 14px; font-weight: 600; color: #777; margin-top: 2px; overflow-wrap: anywhere; }
    .tr-chev { color: #afafaf; font-size: 16px; transition: transform .15s; }
    .tr-card.open .tr-chev { transform: rotate(180deg); }
    .tr-box { padding: 2px 14px 14px 14px; border-top: 2px solid #f0f0f0; margin: 0 2px; }
    .tr-lab { font-size: 11px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; color: #1cb0f6; margin: 12px 0 3px; }
    .tr-sp, .tr-ex { font-size: 14px; font-weight: 600; color: #3c3c3c; line-height: 1.4; }
    .tr-ex { font-weight: 800; }
    .tr-expt { font-size: 13px; color: #777; margin: 2px 0 6px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 8px; }

<script>
/* ---------- utilità ---------- */
function h(tag, attrs) {
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) {
    [].concat(arguments[i]).forEach(function (x) {
      if (x == null || x === false) return;
      e.append(x.nodeType ? x : document.createTextNode(x));
    });
  }
  return e;
}
function $(id) { return document.getElementById(id); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var ART = /^(il |lo |la |l'|i |gli |le |un |una |uno )/i;
function norm(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').trim(); }
function noArt(s) { return s.replace(ART, ''); }
function lev(a, b) {
  var m = a.length, n = b.length, d = [], i, j;
  for (i = 0; i <= m; i++) d[i] = [i];
  for (j = 1; j <= n; j++) d[0][j] = j;
  for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function speak(text, rate) {
  if (!('speechSynthesis' in window)) return false;
  try {
    var u = new SpeechSynthesisUtterance(text); u.lang = 'it-IT'; u.rate = rate || .85;
    var v = (speechSynthesis.getVoices() || []).filter(function (x) { return x.lang && x.lang.toLowerCase().indexOf('it') === 0; })[0];
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u); return true;
  } catch (e) { return false; }
}
function svg(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

var SPEAKER = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';

function mascot(sad) { var d = h('div', { class: 'mascot', 'aria-hidden': 'true' }); d.innerHTML = mascotSvg(sad); return d; }
function bubble(label, text, audioText) {
  var inner = h('div', {}, label ? h('span', { class: 'bubble-label' }, label) : null, text);
  var kids = [];
  if (audioText) {
    var ok = 'speechSynthesis' in window;
    var b = h('button', { class: 'audio-btn', type: 'button', disabled: !ok, 'aria-label': 'Ascolta', onclick: function () { speak(audioText, .85); } });
    b.innerHTML = SPEAKER; kids.push(b);
  }
  kids.push(inner);
  return h('div', { class: 'speaker-section' }, mascot(), h('div', { class: 'speech-bubble' }, kids));
}

/* ---------- elementi riutilizzabili ---------- */
/* scelta multipla: selezione + CONTROLLA. opts: {layout:'col'|'grid'|'two', onSelect(c)} */
function choices(item, ctx, list, answer, explain, opts) {
  opts = opts || {};
  var cls = opts.layout === 'grid' ? 'options-grid' : opts.layout === 'two' ? 'options-two' : 'options-col';
  var box = h('div', { class: cls }), sel = null;
  var order = opts.fixed ? list : shuffle(list);
  var cards = order.map(function (c) {
    var b = h('button', { class: 'choice-card', type: 'button' }, c);
    b.addEventListener('click', function () {
      if (ctx.isDone()) return;
      cards.forEach(function (x) { x.classList.remove('selected'); });
      b.classList.add('selected'); sel = c;
      if (opts.onSelect) opts.onSelect(c);
      ctx.ready(function () { return { ok: sel === answer, solution: answer, note: explain }; });
    });
    return b;
  });
  box.append.apply(box, cards);
  ctx.after(function (ok) {
    cards.forEach(function (x) {
      x.disabled = true;
      if (x.textContent === answer) { x.classList.remove('selected'); x.classList.add('right'); }
      else if (x.classList.contains('selected')) { x.classList.remove('selected'); x.classList.add('wrong'); }
    });
    if (opts.onDone) opts.onDone(ok);
  });
  return box;
}

/* frase con spazio vuoto */
function blankSentence(before, after) {
  var bl = h('span', { class: 'blank' }, ' ');
  return { el: h('p', { class: 'sentence' }, before, bl, after), blank: bl };
}

/* costruttore: lettere o parole da mettere in ordine */
function builder(item, ctx, join, letter) {
  var order, placed = [];
  do { order = shuffle(item.tokens.map(function (t, k) { return { t: t, k: k }; })); }
  while (order.length > 1 && order.every(function (o, k) { return o.k === k; }));
  var line = h('div', { class: 'answer-line-area' }), bank = h('div', { class: 'word-bank' });
  var target = item.tokens.join(join);
  var chips = order.map(function (o) {
    var c = h('button', { class: 'word-chip' + (letter ? ' letter' : ''), type: 'button' }, o.t);
    c.addEventListener('click', function () {
      if (ctx.isDone()) return;
      var i = placed.indexOf(o);
      if (i >= 0) placed.splice(i, 1); else placed.push(o);
      draw();
    });
    return c;
  });
  var ghosts = order.map(function (o) { return h('div', { class: 'word-chip placed' + (letter ? ' letter' : '') }, o.t); });
  function draw() {
    line.replaceChildren.apply(line, placed.map(function (o) { return chips[order.indexOf(o)]; }));
    bank.replaceChildren.apply(bank, order.map(function (o, i) { return placed.indexOf(o) >= 0 ? ghosts[i] : chips[i]; }));
    if (placed.length === order.length) {
      ctx.ready(function () {
        var s = placed.map(function (o) { return o.t; }).join(join);
        return { ok: s === target, solution: target };
      });
    } else ctx.ready(null);
  }
  draw();
  return [line, bank];
}

/* risposta scritta (Scrivi la parola e Dettato) */
function judge(input, answer) {
  var n = norm(input), a = norm(answer), typedArt = ART.test(n);
  if (n === a || (noArt(n) === noArt(a) && !typedArt))
    return { ok: true, note: ART.test(a) && !typedArt ? "Con l'articolo: " + answer + '.' : '' };
  if (noArt(n) === noArt(a)) return { ok: false, solution: answer, note: 'Parola giusta, articolo sbagliato.' };
  if (lev(noArt(n), noArt(a)) <= 2) return { ok: false, solution: answer, note: 'Quasi!' };
  return { ok: false, solution: answer };
}
function typed(item, ctx) {
  var input = h('input', { class: 'text-in', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'Scrivi in italiano', 'aria-label': 'La tua risposta' });
  input.addEventListener('input', function () {
    ctx.ready(input.value.trim() ? function () { return judge(input.value, item.answer); } : null);
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); ctx.check(); } });
  setTimeout(function () { if (!ctx.isDone()) input.focus(); }, 50);
  return input;

/* tag grammaticali o di registro: non servono per raggruppare per tema */
var META = {};
['sostantivo', 'aggettivo', 'verbo', 'espressione', 'maschile', 'femminile', 'plurale', 'cognato', 'falsi amici',
 'diminutivo', 'composto', 'participio', 'collettivo', 'doppia voce', 'da verificare', "frase d'esempio", 'colloquiale',
 'figurato', 'modo di dire', 'passato prossimo', 'imperfetto', 'riflessivo', 'imperativo', 'prefisso semi-', 'sinonimi',
 'quotidiano', 'registro formale', 'registro letterario', 'registro tecnico', 'informale', 'anglicismo', 'paragone',

function parseCSV(text) {

      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;

    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function loadRows(text) {

  if (idx['Parola/Espressione'] == null) throw new Error('Manca la colonna «Parola/Espressione».');
  var out = t.filter(function (r) { return r.some(function (x) { return x.trim(); }); }).map(function (r, ix) {
    function g(c) { return idx[c] == null ? '' : (r[idx[c]] || '').trim(); }
    var o = {
      id: ix, varianti: (g('Varianti') === '-' ? '' : g('Varianti')), pers: g('Personaggio'), text: g('Parola/Espressione'), nota: g('Nota'), spieg: g('Spiegazione'), tags: g('Tags'),
      tipo: g('Tipo').toLowerCase(), art: g('Articolo'), lemma: g('Lemma'), trad: g('Traduzione'), fonte: g('Trad_Fonte'),
      frase: g('Frase'), frasePt: g('Frase_PT'), vuoto: g('Vuoto'), conf: g('Confondibile con'),
      esc: g('Escludi da').toLowerCase(),
      alt: g('Alternative').split(';').map(function (s) { return s.trim(); }).filter(Boolean)
    };
    if (!o.frase && o.tipo === 'frase') o.frase = o.text;
    o.tagList = o.tags.split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
    o.uncertain = o.tagList.indexOf('da verificare') >= 0;
    o.pos = ['sostantivo', 'aggettivo', 'verbo', 'espressione'].filter(function (p) { return o.tagList.indexOf(p) >= 0; })[0] || '';
    o.themes = o.tagList.filter(function (x) { return !META[x]; });

/* ---------- regole di idoneità ---------- */
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---------- copertura: ogni voce idonea esce una volta per giro ----------
   SEEN[«esercizio|foglio»] = { id della voce: 1 } per il giro in corso.
   Una voce si segna come vista quando la domanda viene mostrata. Quando tutte le voci
   idonee sono state viste, il giro ricomincia da capo. */
var SEEN = {}, STORE = '';
function seenOf(n) { var k = n + '|' + FOGLIO; return (SEEN[k] = SEEN[k] || {}); }
function saveSeen() { try { localStorage.setItem(STORE, JSON.stringify(SEEN)); } catch (e) {} }
function loadSeen() { SEEN = {}; try { SEEN = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { SEEN = {}; } }
function hashText(t) { var h = 5381, i = 0; for (; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36); }
/* sceglie `count` elementi dal pool: prima quelli non ancora visti nel giro; se finiscono, ricomincia il giro */
function draw(n, pool, count) {
  var S = seenOf(n), fresh = pool.filter(function (x) { return !S[x.id]; });
  count = Math.min(count, pool.length);
  var out = shuffle(fresh).slice(0, count), wrapAt = out.length;
  if (out.length < count) {
    var rest = shuffle(pool.filter(function (x) { return out.indexOf(x) < 0; }));
    out = out.concat(rest.slice(0, count - out.length));
  }

  return out;
}
/* segna sulla domanda quali voci rappresenta e se appartiene al nuovo giro */
function stamp(item, ids, wrapped) { item._k = [].concat(ids); item._wrap = !!wrapped; return item; }
function drawItems(n, pool, count, mk) {

}
/* un insieme tematico di `size` voci, con le non viste per prime (Associazione e Memory) */
function coverSet(n, pool, size, used) {
  var S = seenOf(n), free = pool.filter(function (r) { return used.indexOf(r) < 0; });
  var fresh = free.filter(function (r) { return !S[r.id]; }), set, wrap = false;
  if (fresh.length >= size) set = themedSet(fresh, size, []);
  else {
    wrap = true; set = fresh.slice();
    set = set.concat(themedSet(free.filter(function (r) { return set.indexOf(r) < 0; }), size - set.length, []));
  }
  if (set.length < size) { wrap = wrap || true; set = set.concat(shuffle(pool.filter(function (r) { return set.indexOf(r) < 0; })).slice(0, size - set.length)); }
  return { set: set, wrap: wrap };
}
function roundsFor(poolLen, size, perRound) {
  var want = NQ >= 1e9 ? Math.ceil(poolLen / size) : Math.max(1, Math.round(NQ / perRound));
  return Math.max(1, Math.min(want, NQ >= 1e9 ? 40 : 12, Math.floor(poolLen / size + (NQ >= 1e9 ? 0.99 : 0))));
}
function answerText(r) { return !r.lemma ? '' : r.art ? r.art + (/'$/.test(r.art) ? '' : ' ') + r.lemma : r.lemma; }
function disp(r) { return cap(answerText(r)); }
function shown(r) { return r.tipo === 'parola' ? disp(r) : r.text; }
function inFoglio(r) { return !FOGLIO || r.pers === FOGLIO; }
/* una voce è idonea a un esercizio se non è «da verificare» e il nome dell'esercizio non è in «Escludi da» */
function ok(r, key) { return !r.uncertain && inFoglio(r) && r.esc.split(/[;,\s]+/).indexOf(key) < 0; }
function words(key) { return ROWS.filter(function (r) { return r.tipo === 'parola' && r.lemma && ok(r, key); }); }
function wordsT(key) { return words(key).filter(function (r) { return r.trad; }); }
function wordsAny() { return ROWS.filter(function (r) { return r.tipo === 'parola' && r.lemma && !r.uncertain && inFoglio(r); }); }

/* la Spiegazione non deve contenere la parola stessa */
function leaks(r) {
  var sp = norm(r.spieg).split(/[^a-z]+/).filter(Boolean);
  return norm(r.lemma).split(/[^a-z]+/).filter(function (w) { return w.length >= 6; }).some(function (w) {
    var stem = w.slice(0, Math.max(5, w.length - 2));

/* alternative plausibili: stessa classe grammaticale, più tag in comune prima */
function similar(r, pool, k, label) {

  if (cand.length < k) cand = cand.concat(shuffle(pool.filter(function (x) { return x !== r && x.pos !== r.pos; })));

  cand.sort(function (a, b) { return score(b) - score(a); });

    seen[n] = 1; out.push(cand[i]);

/* insieme di voci con lo stesso tema (per Associazione e Memory) */
function themedSet(pool, size, avoid) {
  var base = pool.filter(function (r) { return !avoid || avoid.indexOf(r) < 0; });
  if (base.length < size) base = pool.slice();
  var by = {};
  base.forEach(function (r) { r.themes.forEach(function (t) { (by[t] = by[t] || []).push(r); }); });
  var maxSize = Math.max(size, Math.floor(base.length * 0.6));
  var themes = Object.keys(by).filter(function (t) { return by[t].length >= size && by[t].length <= maxSize; });
  if (!themes.length) themes = Object.keys(by).filter(function (t) { return by[t].length >= size; });

  chosen = chosen.concat(shuffle(base.filter(function (r) { return chosen.indexOf(r) < 0; })));

  for (var i = 0; i < chosen.length && out.length < size; i++) {
    var k = norm(chosen[i].trad);

/* ---------- 2 · frase con spazio vuoto ---------- */
function splitBlank(r) {
  var re = new RegExp('(^|[^\\p{L}])(' + r.vuoto.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\p{L}])', 'iu');

}
/* ---------- altri insiemi ---------- */

}

    'il': 'Maschile singolare davanti a consonante: il.',

var cur, qi, hearts, score, checkFn, done, afterFn;

var ctx = {

    checkFn = fn || null;
    var b = $('footer').querySelector('.btn-main');
    if (b && !done) b.disabled = !checkFn;
  },
  check: function () { runCheck(); },
  lose: function () { hearts = Math.max(0, hearts - 1); $('hearts').textContent = hearts; },
  finish: function (ok, solution, note) { finish(ok, solution, note); }
};

function footerIdle() {
  var f = $('footer'); f.className = 'footer';
  f.replaceChildren(
    h('button', { class: 'btn-main', type: 'button', disabled: true, onclick: runCheck }, cur.auto ? 'Continua' : 'Controlla'),
    h('div', { class: 'home-indicator' }));
}
function runCheck() {
  if (!checkFn || done) return;
  var r = checkFn();
  finish(r.ok, r.solution, r.note);
}
function finish(ok, solution, note) {
  if (done) return;
  done = true; checkFn = null;
  if (ok) score++; else ctx.lose();
  $('body').querySelectorAll('input').forEach(function (i) { i.disabled = true; });
  if (afterFn) afterFn(ok);
  var last = qi === cur.items.length - 1;
  var f = $('footer'); f.className = 'drawer ' + (ok ? 'good' : 'bad');
  var icon = ok
    ? '<svg width="28" height="28" viewBox="0 0 24 24" fill="#58cc02"><circle cx="12" cy="12" r="11"/><polyline points="8 12 11 15 16 9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
    : '<svg width="28" height="28" viewBox="0 0 24 24" fill="#ff4b4b"><circle cx="12" cy="12" r="11"/><line x1="8" y1="8" x2="16" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="16" y1="8" x2="8" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';
  var praise = ['Esatto!', 'Ottimo!', 'Bravo!', 'Perfetto!'][Math.floor(Math.random() * 4)];
  var status = h('div', { class: 'drawer-status', role: 'status' });
  status.innerHTML = icon; status.append(h('span', {}, ok ? praise : 'Soluzione corretta:'));
  f.replaceChildren(status,

    note ? h('div', { class: 'drawer-note' }, note) : null,
    h('button', { class: 'btn-main', type: 'button', onclick: next }, last ? 'Fine' : 'Continua'),

var TRAIN = { n: 0, name: 'Allenamento', title: 'Allenamento', items: [], pool: function () { return []; }, needs: '' };

function trCard(r) {
  var title = r.tipo === 'parola' ? disp(r) : r.text;
  var tr = r.tipo === 'frase' ? (r.frasePt || r.nota) : (r.trad || r.nota);
  var canSpeak = 'speechSynthesis' in window;
  function spk(text, label, rate, cls) {

      onclick: function (e) { e.stopPropagation(); speak(text, rate); } });

  var box = h('div', { class: 'tr-box', hidden: true });

  if (r.spieg) box.append(h('div', { class: 'tr-lab' }, 'Spiegazione'), h('div', { class: 'tr-sp' }, r.spieg));
  if (r.tipo !== 'frase' && r.frase) {
    var ex = spk(r.frase, 'Ascolta la frase', .85, 'tr-mini'); ex.textContent = '▶ Ascolta';
    box.append(h('div', { class: 'tr-lab' }, 'Esempio'), h('div', { class: 'tr-ex' }, r.frase),
      r.frasePt ? h('div', { class: 'tr-expt' }, r.frasePt) : '', ex);
  }
  if (r.nota && norm(r.nota) !== norm(tr || '')) box.append(h('div', { class: 'tr-lab' }, 'Appunto del quaderno'), h('div', { class: 'tr-sp' }, r.nota));
  var slow = spk(sayText(r), 'Ascolta più lentamente', .5, 'tr-mini'); slow.textContent = '🐢 Più lento';
  var tags = r.themes.slice(0, 6).map(function (t) { return h('span', { class: 'tr-tag' }, t); });
  box.append(h('div', { class: 'tr-actions' }, slow), tags.length ? h('div', { class: 'tr-tags' }, tags) : '');
  var chev = h('span', { class: 'tr-chev', 'aria-hidden': 'true' }, '▾');

  return card;

function showTraining() {

/* segna le voci della domanda come viste; se la domanda apre un nuovo giro, azzera prima il giro */
var showQ_engine = showQ;
showQ = function () {
  var it = cur.items && cur.items[qi];
  if (it && it._k) {
    var S = seenOf(cur.n);
    if (it._wrap && !cur._wrapped) {
      cur._wrapped = true;
      Object.keys(S).forEach(function (k) { delete S[k]; });
      cur.items.slice(0, qi).forEach(function (x) { (x._k || []).forEach(function (id) { S[id] = 1; }); });
    }
    it._k.forEach(function (id) { S[id] = 1; });
    saveSeen();
    buildSidebar();
  }
  showQ_engine();
};

function load(n) {
  var hp = $('hearts').parentNode; if (hp) hp.style.visibility = '';
  var tab = n === 0 ? 'train' : 'home';
  if (n > 0) LASTEX = n;
  if (tab !== TAB) { TAB = tab; buildSidebar(); }
  if (n === 0) return showTraining();
  cur = EX.filter(function (e) { return e.n === n; })[0];
  cur._wrapped = false;
  qi = 0; hearts = 5; score = 0;
  $('hearts').textContent = hearts;
  $('modal').hidden = true;
  document.querySelectorAll('.screen-item').forEach(function (el) { el.classList.toggle('active', +el.dataset.n === n); });
  try { history.replaceState(null, '', '#' + n); } catch (e) {}
  cur.items = cur.gen();
  if (!cur.items.length) showEmpty(); else showQ();
}

    h('div', { class: 'cover-n' }, (cv.rows.length - cv.miss.length) + ' di ' + cv.rows.length + ' voci hanno almeno un esercizio'));
  if (cv.miss.length) {
    var det = h('details', { class: 'cover-d' }, h('summary', {}, cv.miss.length + (cv.miss.length === 1 ? ' voce senza esercizi' : ' voci senza esercizi')));
    cv.miss.forEach(function (r) { det.append(h('div', { class: 'cover-r' }, h('b', {}, r.text), ' · ' + why(r))); });
    box.append(det);
  }
  box.append(h('button', { class: 'cover-b', type: 'button', onclick: resetSeen }, 'Azzera i giri'));
  side.append(box);
  EX.forEach(function (e) { if (cats.indexOf(e.cat) < 0) cats.push(e.cat); });
  cats.forEach(function (c) {
    var list = EX.filter(function (e) { return e.cat === c; });
    side.append(h('div', { class: 'sess' }, ico('stella', 'sess-ico'),
      h('div', {}, h('div', { class: 'sess-name' }, c), h('div', { class: 'sess-sub' }, list.length + (list.length === 1 ? ' esercizio' : ' esercizi')))));
    list.forEach(function (e) {
      var cnt = e.pool().length, S = seenOf(e.n), seen = e.pool().filter(function (x) { return S[x.id]; }).length;
      side.append(h('button', { class: 'screen-item' + (cnt < e.min ? ' off' : '') + (cur && cur.n === e.n ? ' active' : ''), type: 'button', 'data-n': e.n, onclick: function () { load(e.n); } },
        h('div', { class: 'screen-num ex' }, ico('libretto', 'ex-ico')),
        h('div', { class: 'screen-info' }, h('div', { class: 'screen-name' }, e.name),
          h('div', { class: 'screen-desc', title: e.desc }, (seen ? '' : e.desc + ' · ') + (seen ? seen + '/' + cnt + ' viste' : cnt + ' voci')))));
    });
  });
}

function setStatus(msg) { $('data-status').textContent = msg; }

function fillFoglio() {
  var sel = $('sel-foglio'), names = [];
  ROWS.forEach(function (r) { if (r.pers && names.indexOf(r.pers) < 0) names.push(r.pers); });
  sel.replaceChildren(h('option', { value: '' }, 'Tutti i fogli'));
  names.forEach(function (nm) { sel.append(h('option', { value: nm }, nm)); });
  if (names.indexOf(FOGLIO) < 0) FOGLIO = '';
  sel.value = FOGLIO;
}

function applyCSV(text, label) {
  var info;
  try { info = loadRows(text); } catch (e) { setStatus('CSV non valido: ' + e.message); return false; }
  STORE = 'ginestra-giri-' + hashText(text); loadSeen();
  var skipped = ROWS.filter(function (r) { return r.uncertain; }).length;
  setStatus((label || 'glossario') + ' · ' + ROWS.length + ' voci' + (skipped ? ' · ' + skipped + ' «da verificare» escluse' : '') +
    (info.hasNew ? '' : ' · mancano le colonne Tipo e Lemma: nessun esercizio disponibile'));
  fillFoglio();
  buildSidebar();
  return true;
}

(function () {
  $('modal-mascot').innerHTML = mascotSvg(true);
  $('close').addEventListener('click', function () { $('modal').hidden = false; });
  $('keep').addEventListener('click', function () { $('modal').hidden = true; });
  $('end').addEventListener('click', function () { load(cur.n); });
  $('restart-top').addEventListener('click', function () { load(cur.n); });
  $('sel-foglio').addEventListener('change', function () { FOGLIO = this.value; buildSidebar(); load(cur.n); });
  $('sel-n').addEventListener('change', function () { NQ = this.value === 'tutte' ? 1e9 : +this.value; load(cur.n); });
  $('csv-file').addEventListener('change', function () {
    var f = this.files && this.files[0], input = this;
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { if (applyCSV(String(rd.result), f.name)) load(cur.n); input.value = ''; };
    rd.readAsText(f, 'utf-8');
  });
  var start = parseInt((location.hash || '').slice(1), 10);
  cur = EX[0];
  applyCSV(CSV_TEXT, 'glossario_aggiornato.csv');
  load(start === 0 || EX.some(function (e) { return e.n === start; }) ? start : 1);
})();
</script>
