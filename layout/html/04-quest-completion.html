<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duolingo - Quest Completion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .phone-container {
      width: 100%;
      max-width: 430px;
      height: 932px;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18), 0 0 0 10px #1a1a1a;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #000000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Top Navigation Header */
    .top-header {
      padding: 58px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #afafaf;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gems-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 17px;
      font-weight: 800;
      color: #1cb0f6;
    }

    /* Main Area */
    .content {
      padding: 12px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .title-banner {
      font-size: 26px;
      font-weight: 900;
      color: #ffc800;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: -0.2px;
    }

    /* Quest Cards Container */
    .quests-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Completed Active Quest Card */
    .quest-card-active {
      background: linear-gradient(135deg, #e5f6ff 0%, #f0faff 100%);
      border: 2px solid #1cb0f6;
      border-radius: 20px;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 0 #1899d6;
      position: relative;
    }

    /* Regular Quest Card */
    .quest-card {
      background: #ffffff;
      border: 2px solid #e5e5e5;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 3px 0 #f0f0f0;
    }

    .quest-inner-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
    }

    .quest-inner-row:not(:last-child) {
      border-bottom: 1.5px solid #f0f0f0;
      padding-bottom: 16px;
    }

    .quest-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quest-body {
      flex: 1;
    }

    .quest-title {
      font-size: 16.5px;
      font-weight: 800;
      color: #4b4b4b;
      margin-bottom: 8px;
    }

    .quest-title.blue {
      color: #1cb0f6;
    }

    /* Custom Progress Bar */
    .progress-bar-wrap {
      width: 100%;
      height: 16px;
      background: #e5e5e5;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: #ffc800;
      border-radius: 8px;
      box-shadow: inset 0 -2px 0 #e5a500;
    }

    .progress-text {
      position: relative;
      z-index: 2;
      font-size: 12.5px;
      font-weight: 800;
      color: #6d5b00;
    }

    .chest-badge {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Monthly Challenge (Pink) */
    .challenge-card {
      margin-top: 16px;
      background: #fff3f9;
      border: 2px solid #f282c0;
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 3px 0 #f07ab9;
    }

    .challenge-badge-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #c2185b;
      box-shadow: 0 4px 0 #880e4f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .challenge-title {
      font-size: 17px;
      font-weight: 800;
      color: #c2185b;
      margin-bottom: 3px;
    }

    .challenge-days {
      font-size: 13.5px;
      font-weight: 700;
      color: #999999;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .challenge-stat {
      font-size: 17px;
      font-weight: 800;
      color: #c2185b;
      margin-left: auto;
    }

    .home-indicator {
      width: 140px;
      height: 5px;
      background: #000000;
      border-radius: 3px;
      margin: auto auto 12px;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- Dynamic Island -->
    <div class="dynamic-island"></div>

    <!-- Top Navigation Header -->
    <div class="top-header">
      <button class="close-btn" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="gems-counter">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#1cb0f6">
          <polygon points="6,3 18,3 22,9 12,21 2,9"/>
        </svg>
        <span>527</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <div class="title-banner">1 Quest complete!</div>

      <div class="quests-container">
        <!-- Quest 1 (Completed with blue highlight) -->
        <div class="quest-card-active">
          <div class="quest-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="#ff9600">
              <path d="M12 2C8 6 7 9 7 12C7 15.5 9.5 18 12 18C14.5 18 17 15.5 17 12C17 9 16 6 12 2Z"/>
              <path d="M12 7C10.5 9 10 11 10 13C10 14.5 11 16 12 16C13 16 14 14.5 14 13C14 11 13.5 9 12 7Z" fill="#ffc800"/>
            </svg>
          </div>

          <div class="quest-body">
            <div class="quest-title blue">Extend your streak</div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" style="width: 100%;"></div>
              <span class="progress-text">1 / 1</span>
            </div>
          </div>

          <!-- Open chest with glowing cyan gem -->
          <div class="chest-badge">
            <svg width="42" height="42" viewBox="0 0 40 40" fill="none">
              <!-- Gem floating -->
              <polygon points="20,2 28,10 20,20 12,10" fill="#1cb0f6"/>
              <polygon points="20,2 25,10 20,18 15,10" fill="#75d6ff"/>
              <!-- Wooden Chest opened -->
              <rect x="5" y="16" width="30" height="18" rx="4" fill="#a0522d"/>
              <rect x="5" y="16" width="30" height="4" fill="#8b4513"/>
              <rect x="17" y="22" width="6" height="7" rx="1.5" fill="#e5a500"/>
            </svg>
          </div>
        </div>

        <!-- Combined Card for Quests 2 & 3 -->
        <div class="quest-card">
          <!-- Quest 2 -->
          <div class="quest-inner-row">
            <div class="quest-icon">
              <!-- Stopwatch -->
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1cb0f6" stroke-width="2.5">
                <circle cx="12" cy="13" r="8"/>
                <path d="M12 9v4l2.5 2"/>
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="10" y1="2" x2="14" y2="2"/>
              </svg>
            </div>
            <div class="quest-body">
              <div class="quest-title">Spend 10 minutes learning</div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width: 50%;"></div>
                <span class="progress-text">5 / 10</span>
              </div>
            </div>
            <div class="chest-badge">
              <!-- Bronze / Silver Chest -->
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
                <rect x="3" y="10" width="28" height="18" rx="3" fill="#8e9aa5"/>
                <rect x="3" y="7" width="28" height="6" rx="2" fill="#adb8c4"/>
                <rect x="14" y="15" width="6" height="6" rx="1" fill="#6c7a87"/>
              </svg>
            </div>
          </div>

          <!-- Quest 3 -->
          <div class="quest-inner-row">
            <div class="quest-icon">
              <!-- Target -->
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#58cc02" stroke-width="2.5">
                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="5"/>
                <circle cx="12" cy="12" r="1.5" fill="#58cc02"/>
                <line x1="19" y1="5" x2="22" y2="2"/>
              </svg>
            </div>
            <div class="quest-body">
              <div class="quest-title">Score 90% or higher in 5 lessons</div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width: 20%;"></div>
                <span class="progress-text">1 / 5</span>
              </div>
            </div>
            <div class="chest-badge">
              <!-- Gold Chest -->
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
                <rect x="3" y="10" width="28" height="18" rx="3" fill="#ffc800"/>
                <rect x="3" y="7" width="28" height="6" rx="2" fill="#e5a500"/>
                <rect x="14" y="15" width="6" height="6" rx="1" fill="#c47a00"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Quest 4 (December Challenge - Pink) -->
        <div class="challenge-card">
          <div class="challenge-badge-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff">
              <path d="M12 2l3 7h7l-5.5 4.5 2 7-6.5-4.5-6.5 4.5 2-7L3 9h7z"/>
            </svg>
          </div>
          <div>
            <div class="challenge-title">December Challenge</div>
            <div class="challenge-days">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span>10 days</span>
            </div>
          </div>
          <div class="challenge-stat">5 / 25</div>
        </div>
      </div>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>

</body>
</html>
