<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duolingo - Where to start</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .phone-container {
      width: 100%;
      max-width: 430px;
      height: 932px;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18), 0 0 0 10px #1a1a1a;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #000000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Navigation Header */
    .top-header {
      padding: 58px 24px 12px;
      display: flex;
      align-items: center;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      margin-left: -8px;
      color: #afafaf;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Prompt Row (Duo + Speech Bubble) */
    .prompt-row {
      display: flex;
      align-items: center;
      padding: 12px 20px 28px;
      gap: 16px;
    }

    .duo-badge {
      width: 86px;
      height: 86px;
      flex-shrink: 0;
      position: relative;
    }

    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 2px solid #e5e5e5;
      border-radius: 18px;
      padding: 14px 18px;
      flex: 1;
      box-shadow: 0 2px 0 #f0f0f0;
    }

    .speech-bubble p {
      font-size: 19px;
      font-weight: 700;
      color: #4b4b4b;
      line-height: 1.35;
    }

    /* Bubble Tail Left */
    .speech-bubble::before, .speech-bubble::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -12px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-style: solid;
    }

    .speech-bubble::before {
      border-width: 9px 12px 9px 0;
      border-color: transparent #e5e5e5 transparent transparent;
      left: -13px;
    }

    .speech-bubble::after {
      border-width: 8px 10px 8px 0;
      border-color: transparent #ffffff transparent transparent;
      left: -10px;
    }

    /* Options List */
    .options-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .option-card {
      border: 2.5px solid #e5e5e5;
      border-radius: 20px;
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #e5e5e5;
      transition: all 0.15s ease;
      background: #ffffff;
      user-select: none;
    }

    .option-card:hover {
      background: #f7f7f7;
    }

    .option-card.selected {
      border-color: #84d8ff;
      background: #ddf4ff;
      box-shadow: 0 4px 0 #84d8ff;
    }

    .option-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e5e5e5;
    }

    .option-icon {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-text h3 {
      font-size: 18px;
      font-weight: 800;
      color: #4b4b4b;
      margin-bottom: 4px;
    }

    .option-text p {
      font-size: 14.5px;
      font-weight: 600;
      color: #777777;
      line-height: 1.3;
    }

    /* Footer */
    .footer {
      padding: 20px 20px 34px;
      background: #ffffff;
    }

    .btn-continue {
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: not-allowed;
      transition: all 0.15s ease;
      background: #e5e5e5;
      color: #afafaf;
      box-shadow: none;
    }

    .btn-continue.active {
      background: #58cc02;
      color: #ffffff;
      box-shadow: 0 4px 0 #46a302;
      cursor: pointer;
    }

    .btn-continue.active:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #46a302;
    }

    .home-indicator {
      width: 140px;
      height: 5px;
      background: #000000;
      border-radius: 3px;
      margin: 16px auto 0;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- Dynamic Island -->
    <div class="dynamic-island"></div>

    <!-- Navigation Header -->
    <div class="top-header">
      <button class="back-btn" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
    </div>

    <!-- Mascot & Speech -->
    <div class="prompt-row">
      <div class="duo-badge">
        <svg viewBox="0 0 100 100" fill="none" style="width:100%; height:100%;">
          <!-- Shadow -->
          <ellipse cx="50" cy="85" rx="36" ry="12" fill="#e5e5e5"/>
          <!-- Body -->
          <path d="M50 15C30 15 20 28 20 54C20 80 30 90 50 90C70 90 80 80 80 54C80 28 70 15 50 15Z" fill="#58cc02"/>
          <path d="M28 20C38 25 44 28 50 28C56 28 62 25 72 20C70 16 64 15 50 15C36 15 30 16 28 20Z" fill="#46a302"/>
          
          <!-- Eyes -->
          <ellipse cx="36" cy="52" rx="12" ry="15" fill="#ffffff"/>
          <ellipse cx="64" cy="52" rx="12" ry="15" fill="#ffffff"/>
          <ellipse cx="38" cy="53" rx="6" ry="9" fill="#3c3c3c"/>
          <ellipse cx="62" cy="53" rx="6" ry="9" fill="#3c3c3c"/>
          <ellipse cx="36" cy="49" rx="2.5" ry="4" fill="#ffffff"/>
          <ellipse cx="60" cy="49" rx="2.5" ry="4" fill="#ffffff"/>

          <!-- Beak -->
          <path d="M44 58C44 58 50 55 56 58C58 63 54 69 50 69C46 69 42 63 44 58Z" fill="#ff9600"/>
          
          <!-- Clipboard Left -->
          <rect x="25" y="60" width="18" height="25" rx="2" fill="#c47a00"/>
          <rect x="27" y="62" width="14" height="21" rx="1" fill="#f5eedc"/>
          <!-- Pencil Right -->
          <polygon points="76,46 72,50 78,50" fill="#f5c28e"/>
          <polygon points="76,46 74,48 77,48" fill="#3c3c3c"/>
          <rect x="71" y="50" width="8" height="15" fill="#ffc800"/>
        </svg>
      </div>

      <div class="speech-bubble">
        <p>Where would you like to start?</p>
      </div>
    </div>

    <!-- Options -->
    <div class="options-list">
      <!-- Option 1: Start from scratch -->
      <div class="option-card" onclick="selectOption(this)">
        <div class="option-icon">
          <!-- Book with bookmark "1" -->
          <svg width="58" height="58" viewBox="0 0 58 58" fill="none">
            <!-- Book Base -->
            <rect x="8" y="6" width="42" height="46" rx="6" fill="#ffc800"/>
            <!-- Book Spine Accent / Border -->
            <rect x="44" y="6" width="6" height="46" rx="3" fill="#e5a500"/>
            <rect x="6" y="48" width="46" height="4" rx="2" fill="#e5a500"/>
            <!-- Ribbon Bookmark -->
            <path d="M16 6V18L21 14L26 18V6H16Z" fill="#ff4b4b"/>
            <!-- Number 1 -->
            <text x="28" y="38" font-family="'Nunito', sans-serif" font-weight="900" font-size="24" fill="#c47a00" text-anchor="middle">1</text>
          </svg>
        </div>
        <div class="option-text">
          <h3>Start from scratch</h3>
          <p>Take the easiest lesson of the French course</p>
        </div>
      </div>

      <!-- Option 2: Find my level -->
      <div class="option-card" onclick="selectOption(this)">
        <div class="option-icon">
          <!-- Compass -->
          <svg width="58" height="58" viewBox="0 0 58 58" fill="none">
            <circle cx="29" cy="29" r="24" stroke="#1cb0f6" stroke-width="4.5" fill="#ffffff"/>
            <!-- Compass needle -->
            <polygon points="29,14 36,29 29,26 22,29" fill="#ff4b4b"/>
            <polygon points="29,44 36,29 29,26 22,29" fill="#e5e5e5"/>
          </svg>
        </div>
        <div class="option-text">
          <h3>Find my level</h3>
          <p>Let Duo recommend where you should start learning</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button id="continue-btn" class="btn-continue" onclick="onContinue()">CONTINUE</button>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    function selectOption(el) {
      document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      const btn = document.getElementById('continue-btn');
      btn.classList.add('active');
    }

    function onContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn.classList.contains('active')) {
        alert('Starting your placement or intro lesson!');
      }
    }
  </script>
</body>
</html>
